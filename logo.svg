<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190" role="img" aria-label="Gear and laptop logo with the initials GM" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- gear: ring body with a hole, plus 8 teeth -->
  <g fill="#f1f2f4" transform="translate(52 52)">
    <circle r="21" fill="none" stroke="#f1f2f4" stroke-width="18"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(45)"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(90)"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(135)"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(180)"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(225)"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(270)"/>
    <rect x="-7" y="-43" width="14" height="14" rx="2" transform="rotate(315)"/>
  </g>

  <!-- laptop screen and base -->
  <rect x="60" y="100" width="130" height="64" rx="8" fill="none" stroke="#f1f2f4" stroke-width="8"/>
  <rect x="48" y="171" width="148" height="12" rx="6" fill="#f1f2f4"/>

  <!-- initials: G and M -->
  <g fill="none" stroke="#f1f2f4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M119 121.7 A13 16 0 1 0 120.3 140 L120.3 132.5 L110 132.5"/>
    <polyline points="133,148 133,116 143,138 153,116 153,148"/>
  </g>
</svg>
